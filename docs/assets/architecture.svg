      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2637" stroke-opacity="0.32" stroke-width="1"/>
    </pattern>
  </defs><rect width="1200" height="830" fill="#05070d"/><rect width="1200" height="830" fill="url(#grid)"/><ellipse cx="600" cy="60" rx="520" ry="120" fill="url(#halo)"/><text x="40.0" y="50.0" font-size="12" fill="#22d3ee" font-weight="700" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" letter-spacing="3" >ARCHITECTURE</text><text x="40.0" y="72.0" font-size="19" fill="#e8eefc" font-weight="700" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" >Four lanes, one cross-runtime boundary</text><rect x="170" y="96" width="990" height="150" rx="16" fill="#0a101b" fill-opacity="0.55" stroke="#a855f7" stroke-opacity="0.3" stroke-dasharray="7 7"/><text x="192.0" y="121.0" font-size="12" fill="#a855f7" font-weight="800" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" letter-spacing="2.4" >CLIENT</text><text x="300.0" y="121.0" font-size="10.5" fill="#6b7a93" font-weight="400" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >browser only — no server round-trip</text><line x1="600.0" y1="246.0" x2="600.0" y2="282.0" stroke="#a855f7" stroke-width="1.6" stroke-opacity="0.65"/><circle cx="600.0" cy="282.0" r="3" fill="#a855f7" filter="url(#glow)"/><text x="614.0" y="264.0" font-size="9" fill="#5a677d" font-weight="400" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >hands off</text><rect x="170" y="282" width="990" height="150" rx="16" fill="#0a101b" fill-opacity="0.55" stroke="#22d3ee" stroke-opacity="0.3" stroke-dasharray="7 7"/><text x="192.0" y="307.0" font-size="12" fill="#22d3ee" font-weight="800" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" letter-spacing="2.4" >EDGE</text><text x="300.0" y="307.0" font-size="10.5" fill="#6b7a93" font-weight="400" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >Streamlit host — chrome stripped</text><line x1="600.0" y1="432.0" x2="600.0" y2="468.0" stroke="#22d3ee" stroke-width="1.6" stroke-opacity="0.65"/><circle cx="600.0" cy="468.0" r="3" fill="#22d3ee" filter="url(#glow)"/><text x="614.0" y="450.0" font-size="9" fill="#5a677d" font-weight="400" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >hands off</text><rect x="170" y="468" width="990" height="150" rx="16" fill="#0a101b" fill-opacity="0.55" stroke="#3b82f6" stroke-opacity="0.3" stroke-dasharray="7 7"/><text x="192.0" y="493.0" font-size="12" fill="#3b82f6" font-weight="800" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" letter-spacing="2.4" >CORE</text><text x="300.0" y="493.0" font-size="10.5" fill="#6b7a93" font-weight="400" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >two runtimes, one file contract</text><line x1="600.0" y1="618.0" x2="600.0" y2="654.0" stroke="#3b82f6" stroke-width="1.6" stroke-opacity="0.65"/><circle cx="600.0" cy="654.0" r="3" fill="#3b82f6" filter="url(#glow)"/><text x="614.0" y="636.0" font-size="9" fill="#5a677d" font-weight="400" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >hands off</text><rect x="170" y="654" width="990" height="150" rx="16" fill="#0a101b" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.3" stroke-dasharray="7 7"/><text x="192.0" y="679.0" font-size="12" fill="#10b981" font-weight="800" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" letter-spacing="2.4" >STATE</text><text x="300.0" y="679.0" font-size="10.5" fill="#6b7a93" font-weight="400" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >what survives a run</text><rect x="190
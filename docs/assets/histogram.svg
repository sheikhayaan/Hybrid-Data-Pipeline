ode', 'SF Mono', Consolas, monospace" >2</text><text x="343.0" y="400.0" font-size="9.5" fill="#8b9bb4" font-weight="400" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >1500–2000</text><rect x="408" y="118.0" width="82" height="262.0" rx="6" fill="#a855f7" fill-opacity="0.82"/><rect x="408" y="118.0" width="82" height="3" rx="1.5" fill="#a855f7" filter="url(#glow)"/><text x="449.0" y="109.0" font-size="12" fill="#e8eefc" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >3</text><text x="449.0" y="400.0" font-size="9.5" fill="#8b9bb4" font-weight="400" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >2000–2500</text><rect x="514" y="118.0" width="82" height="262.0" rx="6" fill="#f59e0b" fill-opacity="0.82"/><rect x="514" y="118.0" width="82" height="3" rx="1.5" fill="#f59e0b" filter="url(#glow)"/><text x="555.0" y="109.0" font-size="12" fill="#e8eefc" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >3</text><text x="555.0" y="400.0" font-size="9.5" fill="#8b9bb4" font-weight="400" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >2500–3000</text><line x1="82" y1="381" x2="580" y2="381" stroke="#1b2637" stroke-width="1.2"/><text x="90.0" y="424.0" font-size="10.5" fill="#8b9bb4" font-weight="400" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >fit latency bucket (ms)</text><text x="58.0" y="96.0" font-size="9.5" fill="#5a677d" font-weight="400" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >fits</text><text x="40.0" y="452.0" font-size="11" fill="#e8eefc" font-weight="600" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace" >mean 1,930 ms · median 2,0